volumes:
  dkmovie_local_postgres_data: {}
  dkmovie_local_redis_data: {}
  dkmovie_local_minio_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: dkmovie_local_django
    container_name: dkmovie_local_django
    env_file:
      - ./.envs/.local/.postgres
      - ./.envs/.local/.django
    ports:
      - 8000:8000
    volumes:
      - /app/.venv
      - .:/app:z
    depends_on:
      - postgres
      - redis
      - mailpit
      - minio
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: dkmovie_production_postgres
    container_name: dkmovie_local_postgres
    volumes:
      - dkmovie_local_postgres_data:/var/lib/postgresql/18/docker
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest@sha256:3bd7c2f2696deb35a4780d152b404dceec99cb041b942c0877b3b22384714f85
    container_name: dkmovie_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8@sha256:0a972391db0b24ec336e35d1bc98b237237e26f82bf5120cf2f6b1688d1df973
    container_name: dkmovie_local_redis
    volumes:
      - dkmovie_local_redis_data:/data

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: dkmovie_local_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./.envs/.local/.minio
    volumes:
      - dkmovie_local_minio_data:/data
    command: server /data --console-address ":9001"

  createbuckets:
    build:
      context: .
      dockerfile: ./compose/local/minio/Dockerfile
    container_name: dkmovie_local_createbuckets
    depends_on:
      - minio
    env_file:
      - ./.envs/.local/.minio

  celeryworker:
    <<: *django
    image: dkmovie_local_celeryworker
    container_name: dkmovie_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
      - minio
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: dkmovie_local_celerybeat
    container_name: dkmovie_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
      - minio
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: dkmovie_local_flower
    container_name: dkmovie_local_flower
    ports:
      - "5555:5555"
    command: /start-flower

  node:
    build:
      context: .
      dockerfile: ./compose/local/node/Dockerfile
    image: dkmovie_local_node
    container_name: dkmovie_local_node
    env_file:
      - ./.envs/.local/.django
    depends_on:
      - django
    volumes:
      - .:/app:z
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - /app/node_modules
    command: pnpm dev
    ports:
      - "3000:3000"
