{% extends "base.html" %}

{% block title %}
  Forbidden (403)
{% endblock title %}
{% block content %}
  <h1 class="text-4xl underline font-bold my-4">Forbidden (403)</h1>
  <p class="text-lg">
    {% if exception %}
      {{ exception }}
    {% else %}
      You're not allowed to access
      this page.
    {% endif %}
  </p>
{% endblock content %}
