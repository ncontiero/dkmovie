{% load static %}
{% load render_bundle from webpack_loader %}

<!DOCTYPE html>
<html lang="en" class="opacity-0">
  <head>
    <meta charset="utf-8" />
    <meta content="ie=edge" http-equiv="x-ua-compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A Django project of films and series." />
    <meta name="author" content="Nicolas Contiero" />
    {% block overwrite_title %}
    <title>{% block title %}{% endblock title %} • DKMovie</title>
    {% endblock overwrite_title %}

    <link type="image/svg+xml" href="{% static 'images/favicons/favicon.svg' %}" rel="icon" />

    {% render_bundle "main" "css" %}
    {% render_bundle "main" "js" attrs="defer" %}
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
