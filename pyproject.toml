[project]
name = "dkmovie"
version = "0.1.0"
description = "A Django project of films and series."
authors = [ { name = "Nicolas Contiero", email = "admin@ncontiero.com" } ]
license = { text = "MIT" }
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "argon2-cffi==25.1.0",
  "celery==5.6.3",
  "collectfasta==3.3.3",
  "dj-database-url==3.1.2",
  "django==6.0.7",
  "django-allauth[headless,socialaccount,mfa]==65.18.0",
  "django-anymail[brevo]==15.1",
  "django-celery-beat==2.9.0",
  "django-cleanup==9.0.0",
  "django-cors-headers==4.9.0",
  "django-modeltranslation==0.20.3",
  "django-ninja==1.6.2",
  "django-redis==7.0.0",
  "django-storages[s3]==1.14.6",
  "django-webpack-loader==3.2.4",
  "flower==2.0.1",
  "gunicorn==26.0.0",
  "hiredis==3.4.0",
  "orjson==3.11.9",
  "pillow==12.3.0",
  "psycopg[c]==3.3.4",
  "python-decouple==3.8",
  "python-slugify==8.0.4",
  "redis==8.1.0",
  "requests==2.34.2",
]

[dependency-groups]
dev = [
  "coverage==7.15.3",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==7.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.0.7",
  "djlint==1.44.0",
  "mypy==2.3.0",
  "pre-commit==4.6.1",
  "psycopg[binary]==3.3.4",
  "pytest==9.1.1",
  "pytest-django==4.13.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.1",
  "watchfiles==1.2.0",
  "werkzeug[watchdog]==3.1.8",
]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "dkmovie/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]


# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [ "mypy_django_plugin.main" ]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"


# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
use_gitignore = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

# ==== Ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]

lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT"
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest of types for comparison.
  "TC001",  # django-ninja requires runtime evaluation of types
  "TC002",  # django-ninja requires runtime evaluation of types
  "TC003",  # django-ninja requires runtime evaluation of types
]

lint.isort.force-single-line = true
